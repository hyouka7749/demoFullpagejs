<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GOOGLE PHAKE</title>
    <link rel="stylesheet" href="/css/gg.css">
    <link rel="icon" type="image/x-icon" sizes="32x32" href="/assets/images/coffee.ico">
  </head>
  <body>
    <video id="myVideo" control poster="/assets/images/b3.jpg" preload="auto" muted loop> 
      <source src="/assets/videos/ggbr.mp4" type="video/mp4">
    </video>
    <div class="main-container">
      <div class="logo"><img src="https://www.google.com/images/branding/googlelogo/2x/googlelogo_color_272x92dp.png" alt="Google Logo"></div>
      <form action="https://www.google.com/search" method="GET">
        <div class="input-container">
          <input class="input" name="q" type="text" placeholder="Search the internet..." aria-label="Tìm kiếm">
        </div>
        <div class="buttons">
          <input type="submit" value="Tìm với Google">
          <button type="button">Xem trang đầu tiên tìm được</button>
        </div>
      </form>
      <div class="links">Google có các thứ tiếng:<a href="#">English</a><a href="#">Tiếng Việt</a><a href="#">Tiếng Tàu</a></div>
    </div>
    <script>
      document.addEventListener('DOMContentLoaded', function() {
        const logo = document.querySelector('.logo img');
        const video = document.getElementById('myVideo');
        if (logo.complete) {
          video.play();
        } else {
          logo.addEventListener('load', () => {
            video.play();
          });
        }
      });
    </script>
  </body>
</html>
