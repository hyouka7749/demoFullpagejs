<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FullPage Demo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/fullPage.js/4.0.20/fullpage.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="icon" type="image/x-icon" sizes="32x32" href="/assets/images/pen.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Agu+Display&amp;family=Honk&amp;display=swap" rel="stylesheet">
  </head>
  <body>
    <header class="header"><a class="logo" preload href="#home"><span class="logo-demo">GALLARY</span><span class="logo-front">DEMO</span></a>
      <nav>
        <ul>
          <li><a class="fa-solid fa-house nav-link active" href="#home"></a></li>
          <li><a class="fa-solid fa-magnifying-glass nav-link" href="#about"></a></li>
          <li><a class="fa-solid fa-hand-holding-heart nav-link" href="#portfolio">  </a></li>
          <li><a class="fa-solid fa-images nav-link" href="#gallary"></a></li>
          <li><a class="fa-solid fa-phone nav-link" href="#contact"></a></li>
        </ul>
      </nav>
      <button class="hamburger-icon" aria-label="Toggle menu" aria-expanded="false"><i class="fas fa-bars"></i></button>
    </header>
    <div id="fullpage">
      <div class="section hero" data-anchor="home">
        <div class="hero-content" id="hero-section-content">
          <div class="hero-main-content">  
            <h1 class="animate-text">Welcome to my Demo Gallary</h1><a class="fa-brands fa-google" href="/pages01/index.html"></a><a class="fa-solid fa-list-ol" href="/pages02/list.html"></a><a class="fa-solid fa-list-ol" href="/pages03/icon.html"></a>
          </div>
        </div>
      </div>
      <div class="section" id="about-section" data-anchor="about"></div>
      <div class="section" id="portfolio-section" data-anchor="portfolio"></div>
      <div class="section" id="gallary-section" data-anchor="gallary"></div>
      <div class="section" id="contact-section" data-anchor="contact">
        <div class="section-content-wrapper">
          <div class="contact-content">
            <h2>Liên Hệ Với Chúng Tôi</h2>
            <p class="contact-subtitle">Hãy để lại thông tin, chúng tôi sẽ liên hệ với bạn sớm nhất</p>
            <div class="contact-grid">
              <div class="contact-info">
                <div class="contact-info-item"><i class="fas fa-map-marker-alt"></i>
                  <div>
                    <h3>Địa chỉ</h3>
                    <p>123 Đường Xanh, Quận 1, TP.HCM</p>
                  </div>
                </div>
                <div class="contact-info-item"><i class="fas fa-envelope"></i>
                  <div>
                    <h3>Email</h3>
                    <p>info@greenearth.org</p>
                  </div>
                </div>
                <div class="contact-info-item"><i class="fas fa-phone"></i>
                  <div>
                    <h3>Điện thoại</h3>
                    <p>(84) 123 456 789</p>
                  </div>
                </div>
                <div class="social-links">
                  <h3>Kết nối với chúng tôi</h3>
                  <div class="social-icons"><a class="social-icon" href="#" aria-label="Facebook"><i class="fab fa-facebook-f"></i></a><a class="social-icon" href="#" aria-label="Google"><i class="fab fa-google"></i></a><a class="social-icon" href="#" aria-label="LinkedIn"><i class="fab fa-linkedin-in"></i></a></div>
                </div>
              </div>
              <div class="contact-form">
                <h3>Gửi Tin Nhắn</h3>
                <form action="#" method="POST">
                  <div class="form-row">
                    <div class="form-group">
                      <label for="name">Họ và tên</label>
                      <input id="name" type="text" name="name" placeholder="Nhập họ và tên" required>
                    </div>
                    <div class="form-group">
                      <label for="subject">Chủ đề</label>
                      <input id="subject" type="text" name="subject" placeholder="Nhập chủ đề" required>
                    </div>
                  </div>
                  <div class="form-group">
                    <label for="message">Nội dung tin nhắn</label>
                    <textarea id="message" name="message" placeholder="Nhập nội dung tin nhắn" required></textarea>
                  </div>
                  <button type="submit"><span>Gửi Tin Nhắn</span><i class="fas fa-paper-plane"></i></button>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <footer class="site-footer" id="footer">
      <div class="footer-content">
        <p>© 2025 Demo Front.</p>
        <div class="social-icons"><a class="social-icon" href="#" aria-label="Facebook"><i class="fab fa-facebook-f"></i></a><a class="social-icon" href="#" aria-label="Google"><i class="fab fa-google"></i></a><a class="social-icon" href="#" aria-label="LinkedIn"><i class="fab fa-linkedin-in"></i></a></div>
      </div>
    </footer>
    <div class="lightbox" id="image-lightbox"><span class="lightbox-close">×</span><img class="lightbox-content" id="lightbox-img" src="#" alt="Hình ảnh phóng to">
      <div class="lightbox-caption" id="lightbox-caption"></div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fullPage.js/4.0.20/fullpage.min.js"></script>
    <script src="https://www.youtube.com/iframe_api"> </script>
    <script src="js/main.js"></script>
  </body>
</html>
